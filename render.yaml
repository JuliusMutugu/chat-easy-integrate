services:
  - type: web
    name: nego-messaging
    runtime: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: npm install && npm run install:client && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_INCLUDE
        value: dev
      - key: PORT
        value: 3000
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: ./server/messaging.db
      - key: SERVER_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMS_GATEWAY_URL
        sync: false
      - key: SMS_GATEWAY_API_KEY
        sync: false
      - key: SMS_GATEWAY_METHOD
        value: POST
      - key: SMS_SELL_RATE_KES
        value: 0.30
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
    autoDeploy: true
